name: azm
description: "Azm - Gym Tracker"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  intl: ^0.20.3
  cached_network_image: ^4.0.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0
  uuid: ^4.6.0
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter
  sqlite3: ^3.6.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true # gen-l10n (see l10n.yaml)

  assets:
    # Built by tools/build_catalog.dart — never edit by hand.
    - assets/catalog/catalog.sqlite
    - assets/catalog/catalog_version.txt

  fonts:
    # Readex Pro is the ONLY family (variable, wght 200-700). Drive the axis
    # explicitly with FontVariation("wght", w) — see lib/core/theme/azm_type.dart.
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro.ttf
