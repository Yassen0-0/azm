# gen-l10n config. ARB sources: lib/core/l10n/arb/ (Arabic is the template).
# Generated Dart goes to lib/core/l10n/gen/ (committed, regenerated by `flutter gen-l10n`
# and automatically on `flutter pub get` / build).
arb-dir: lib/core/l10n/arb
template-arb-file: app_ar.arb
output-dir: lib/core/l10n/gen
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: true
