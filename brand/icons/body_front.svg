    <path id="adductor-r" transform="matrix(-1 0 0 1 64 0)" d="M29.3 44.2 C30.2 44.2 31.1 44.4 31.8 44.8 L31.5 48.6 C31.3 50.6 31 52.2 30.6 53.4 C29.6 50.4 29 47.2 29.3 44.2 Z"/>
    <!-- lower legs + feet -->
    <path id="shin-l" d="M27.2 56.6 H30.2 C30.6 58.6 30.4 60.4 29.8 62 H27.8 C27.1 60.3 26.9 58.5 27.2 56.6 Z"/>
    <path id="shin-r" transform="matrix(-1 0 0 1 64 0)" d="M27.2 56.6 H30.2 C30.6 58.6 30.4 60.4 29.8 62 H27.8 C27.1 60.3 26.9 58.5 27.2 56.6 Z"/>
