    <circle id="dots-1" class="optional" cx="44.4" cy="56.6" r="1.6"/>
    <circle id="dots-2" class="optional" cx="49.2" cy="56.6" r="1.6"/>
    <circle id="dots-3" class="optional" cx="54" cy="56.6" r="1.6"/>
  </g>
</svg>
