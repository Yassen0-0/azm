    <path id="bicep-l" d="M18.4 25.9 C19.8 24.6 21.7 23.7 23.8 23.4 C23.9 26.8 23.4 30.2 22.2 33.2 L18.2 33.4 C17.6 30.8 17.7 28.3 18.4 25.9 Z"/>
    <path id="bicep-r" transform="matrix(-1 0 0 1 64 0)" d="M18.4 25.9 C19.8 24.6 21.7 23.7 23.8 23.4 C23.9 26.8 23.4 30.2 22.2 33.2 L18.2 33.4 C17.6 30.8 17.7 28.3 18.4 25.9 Z"/>
    <!-- forearms -->
    <path id="forearm-l" d="M18 34.6 L22 34.4 C21.8 37.6 21 40.6 19.8 43.4 L16.8 43.2 C16.6 40.2 17 37.3 18 34.6 Z"/>
