    <path id="abs" d="M28.2 26.8 C29.5 27 30.8 26.7 32 26.3 C33.2 26.7 34.5 27 35.8 26.8 L35.5 37.9 C34.4 38.7 29.6 38.7 28.5 37.9 Z"/>
    <path id="oblique-l" d="M24.9 25 C25.6 25.9 26.4 26.5 27.3 26.8 L27.6 37.6 L25.6 36.2 C24.8 32.6 24.6 28.8 24.9 25 Z"/>
    <path id="oblique-r" transform="matrix(-1 0 0 1 64 0)" d="M24.9 25 C25.6 25.9 26.4 26.5 27.3 26.8 L27.6 37.6 L25.6 36.2 C24.8 32.6 24.6 28.8 24.9 25 Z"/>
    <!-- pelvis -->
    <path id="hips" d="M25.4 37.4 L28.2 39 C30.7 39.8 33.3 39.8 35.8 39 L38.6 37.4 L39.2 41 C36.6 41.8 34.2 42.8 32 44.6 C29.8 42.8 27.4 41.8 24.8 41 Z"/>
