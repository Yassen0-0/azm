    <!-- chest (pecs) -->
    <path id="pec-l" d="M28.9 16.2 H31.3 V25.4 C28.8 26.3 26.3 25.6 24.8 23.4 C25.2 20.2 26.6 17.6 28.9 16.2 Z"/>
