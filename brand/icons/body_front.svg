    <path id="heart" class="optional" d="M34.6 18.4 C35.6 16.9 38.2 17.2 38.3 19.4 C38.4 21.2 36.2 22.7 34.6 23.9 C33 22.7 30.8 21.2 30.9 19.4 C31 17.2 33.6 16.9 34.6 18.4 Z"/>
