    <ellipse id="head" cx="32" cy="6.6" rx="4.3" ry="4.9"/>
    <path id="neck" d="M29.4 11.2 H34.6 L35 15.2 H29 Z"/>
    <!-- shoulders (delts) -->
    <path id="delt-l" d="M27.4 15.6 C23.2 15.4 20.2 16.8 19 19.8 C18.4 21.4 18.3 23 18.5 24.6 C19.8 23.4 21.6 22.5 23.8 22.1 C24.2 19.6 25.4 17.2 27.4 15.6 Z"/>
